<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#222222">
  <title>Кофейня N5</title>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-loading">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="cupStripes" width="8" height="10" patternUnits="userSpaceOnUse">
        <rect width="4" height="10" fill="#f6f1e6"/>
        <rect x="4" width="4" height="10" fill="#1f7a52"/>
      </pattern>
    </defs>
    <symbol id="logo-symbol" viewBox="0 0 1 1"></symbol>
    <symbol id="cup-symbol" viewBox="0 0 44 56">
      <path d="M8 14h28l-3.4 38a3 3 0 0 1-3 2.7H14.4a3 3 0 0 1-3-2.7z" fill="url(#cupStripes)" stroke="#d3ad62" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="5" y="9" width="34" height="7" rx="3" fill="#1f7a52" stroke="#d3ad62" stroke-width="1.4"/>
      <circle cx="22" cy="35" r="9" fill="#17261f" stroke="#d3ad62" stroke-width="1"/>
      <use href="#logo-symbol" x="14.5" y="27.5" width="15" height="15" fill="#f7e2ae" fill-rule="evenodd"/>
    </symbol>
  </svg>

  <header id="appBar">
    <button class="bar-button" id="backButton" type="button" aria-label="Назад"></button>
    <h1 id="pageTitle"></h1>
    <div class="bar-actions">
      <button class="bar-button" id="refreshButton" type="button" aria-label="Обновить"></button>
      <a class="bar-button" id="cartButton" href="#/cart" aria-label="Корзина"><span class="cart-count" id="cartCount"></span></a>
    </div>
  </header>

  <main id="view"></main>
  <nav id="tabBar" aria-label="Основная навигация"></nav>
  <div id="toast" role="status"></div>
  <div id="modal" aria-hidden="true"></div>

  <div id="splash">
    <svg class="splash-logo" aria-hidden="true"><use href="#logo-symbol" width="100%" height="100%"/></svg>
    <div class="spinner"></div>
  </div>

  <script src="logos.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
